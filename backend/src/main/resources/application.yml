spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: electricity-ebilling
  datasource:
    url: ${JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      seedAdminEmail: ${SEED_ADMIN_EMAIL:admin@localhost}
      seedAdminPhone: ${SEED_ADMIN_PHONE:9000000000}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiresIn: ${JWT_EXPIRES_IN}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/ui

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  encryption:
    key: ${APP_ENCRYPTION_KEY}
    iv: ${APP_IV_KEY}
  billing:
    receiver-upi-id: ${BILLING_RECEIVER_UPI_ID}

spring.servlet.multipart.enabled: true
spring.servlet.multipart.max-file-size: 10MB
spring.servlet.multipart.max-request-size: 10MB
