# Dev/demo seed data (context: seed-dev). Skipped in test/prod unless context is set.
# Fixed IDs so login hints and docs stay stable across fresh databases.
databaseChangeLog:
  - changeSet:
      id: seed-dev-connection-types
      author: ebilling
      context: seed-dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM connection_type
      changes:
        - insert:
            tableName: connection_type
            columns:
              - column: { name: id, value: "a1000001-0001-4000-8000-000000000001" }
              - column: { name: type_name, value: "Residential" }
              - column: { name: description, value: "Home / domestic supply" }
        - insert:
            tableName: connection_type
            columns:
              - column: { name: id, value: "a1000001-0001-4000-8000-000000000002" }
              - column: { name: type_name, value: "Commercial" }
              - column: { name: description, value: "Business / shop supply" }

  - changeSet:
      id: seed-dev-tariffs
      author: ebilling
      context: seed-dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM tariff
      changes:
        - insert:
            tableName: tariff
            columns:
              - column: { name: id, value: "b2000001-0001-4000-8000-000000000001" }
              - column: { name: connection_type_id, value: "a1000001-0001-4000-8000-000000000001" }
              - column: { name: min_units, valueNumeric: 0 }
              - column: { name: max_units, valueNumeric: 100 }
              - column: { name: rate_per_unit, valueNumeric: 5.5 }
        - insert:
            tableName: tariff
            columns:
              - column: { name: id, value: "b2000001-0001-4000-8000-000000000002" }
              - column: { name: connection_type_id, value: "a1000001-0001-4000-8000-000000000001" }
              - column: { name: min_units, valueNumeric: 101 }
              - column: { name: max_units, valueNumeric: 500 }
              - column: { name: rate_per_unit, valueNumeric: 7.25 }
        - insert:
            tableName: tariff
            columns:
              - column: { name: id, value: "b2000001-0001-4000-8000-000000000003" }
              - column: { name: connection_type_id, value: "a1000001-0001-4000-8000-000000000002" }
              - column: { name: min_units, valueNumeric: 0 }
              - column: { name: max_units, valueNumeric: 1000 }
              - column: { name: rate_per_unit, valueNumeric: 9.0 }

  - changeSet:
      id: seed-dev-admin-user
      author: ebilling
      context: seed-dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM users WHERE id = 'USR1000001'
      changes:
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: "USR1000001" }
              - column: { name: email, value: "${seedAdminEmail}" }
              - column: { name: first_name, value: "Dev" }
              - column: { name: last_name, value: "Admin" }
              - column: { name: phone_number, value: "${seedAdminPhone}" }
              - column: { name: is_admin, valueBoolean: true }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }

  - changeSet:
      id: seed-dev-sample-customer
      author: ebilling
      context: seed-dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM customers
      changes:
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: "USR1000002" }
              - column: { name: email, value: "customer@localhost" }
              - column: { name: first_name, value: "Demo" }
              - column: { name: last_name, value: "Customer" }
              - column: { name: phone_number, value: "9000000001" }
              - column: { name: is_admin, valueBoolean: false }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }
        - insert:
            tableName: customers
            columns:
              - column: { name: customer_id, value: "CST1000001" }
              - column: { name: user_id, value: "USR1000002" }
              - column: { name: address, value: "123 Demo Street" }
        - insert:
            tableName: connection
            columns:
              - column: { name: id, value: "c3000001-0001-4000-8000-000000000001" }
              - column: { name: customer_id, value: "CST1000001" }
              - column: { name: connection_type_id, value: "a1000001-0001-4000-8000-000000000001" }
              - column: { name: start_date, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: status, value: "ACTIVE" }
