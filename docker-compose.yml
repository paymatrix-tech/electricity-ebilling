services:
  postgres:
    image: postgres:16-alpine
    container_name: electricity-ebilling-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ebilling
      POSTGRES_PASSWORD: ebilling
      POSTGRES_DB: electricity_ebilling
    volumes:
      - electricity_ebilling_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebilling -d electricity_ebilling"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  electricity_ebilling_pg_data:
